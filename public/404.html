<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Immigration Consulting Service</title>
    <script>
      // SPA redirect for GitHub Pages — preserves the path so BrowserRouter can handle it
      var seg = 1; // number of path segments in the base (1 = /immigration-service-centre)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
